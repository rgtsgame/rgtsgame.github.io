<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>億決勝負 - 3D 槍戰遊戲 by RGTS</title>
    <link rel="stylesheet" href="style.css" />
    <script type="importmap">
    {
        "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
  </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Google+Sans+Code:ital,wght,MONO@0,300..800,1;1,300..800,1&family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');
    </style>
</head>

<body>
    <script src="https://freegeometricgames.com/page_code.js"></script>

    <canvas id="game-canvas"></canvas>
    <div id="crosshair"></div>
    <div id="hud" class="hidden">
        <div id="hitmarker"></div>
        <div id="killfeed"></div>
        <div id="hp-bar">HP: <span id="hp-val">100</span></div>
        <div id="hotbar">
            <div class="slot" id="slot-1" data-key="1">
                <span class="slot-num">1</span>
                <span class="slot-name">AK-47</span>
            </div>
            <div class="slot" id="slot-2" data-key="2">
                <span class="slot-num">2</span>
                <span class="slot-name">Pistol</span>
            </div>
            <div class="slot" id="slot-3" data-key="3">
                <span class="slot-num">3</span>
                <span class="slot-name">Knife</span>
            </div>
        </div>
        <div id="ammo-bar">
            <div id="weapon-name">AK-47</div>
            <span id="ammo-val">30</span>
            <span class="ammo-sep">/</span>
            <span id="reserve-val">90</span>
        </div>
        <div id="reload-hint">RELOADING…</div>

        <div id="death-overlay" class="hidden">
            <h1>你死了!</h1>
            <p><span id="respawn-sec">5</span> 秒後重生...</p>
        </div>

        <div id="scoreboard" class="hidden">
            <table>
                <thead>
                    <tr>
                        <th>Player</th>
                        <th>K</th>
                        <th>D</th>
                    </tr>
                </thead>
                <tbody id="sb-body"></tbody>
            </table>
        </div>

        <div id="damage-flash"></div>
    </div>

    <div id="menu-container">
        <div class="top-bar">
            <div class="top-left">
            </div>
            <div class="top-center">
                <h1 class="logo"><span>RGTS</span>GAME</h1>
            </div>
            <div class="top-right">
            </div>
        </div>

        <div class="sidebar">
            <div class="nav-item active">
                <div class="icon">🕹️</div><span>遊玩</span>
            </div>
            <div class="nav-item">
                <div class="icon">🛒</div><span>商店</span>
            </div>
            <div class="nav-item">
                <div class="icon">📋</div><span>任務 (未完成)</span>
            </div>
            <div class="nav-item">
                <div class="icon">🏆</div><span>排行榜 (未完成)</span>
            </div>
            <div class="sidebar-bottom">
                <div class="nav-item" id="settings">
                    <div class="icon">⚙️</div><span>設定</span>
                </div>
            </div>
        </div>

        <div class="main-content">
            <div class="character-area">
                <h2 class="player-name">
                    <span class="level-badge">1</span>
                    <input type="text" id="username-input" maxlength="16" placeholder="Enter Name" spellcheck="false" />
                </h2>
                <div class="character-model-placeholder">
                    <canvas id="character-preview"></canvas>
                </div>
            </div>

            <div class="right-panel">
                <div class="promo-box">
                    <h3>立即稱霸<br>這個戰場</h3>
                    <button class="primary-btn large-play-btn" id="btn-play" disabled>PLAY</button>
                </div>

                <div class="loadout-box">
                    <div class="loadout-header">
                        <span>角色</span>
                        <span>遊戲模式</span>
                    </div>
                    <div class="loadout-body">
                        <div>特工</div>
                        <div>Free For All</div>
                    </div>
                </div>

                <div class="server-status">
                    <h2 class="pinging">正在尋找伺服器...</h2>
                    <!--
                        <div class="server-options">
                            <button class="secondary-btn">選擇伺服器</button>
                        </div>
                    -->
                </div>
            </div>

        </div>
    </div>

    <div id="loading-overlay" class="show">
        <div class="spinner"></div>
        <div id="loading-text">正在載入資源...</div>
    </div>

    <div id="error-overlay">
        <h2 id="error-title">發生錯誤</h2>
        <p id="error-text"></p>
        <button id="error-back-btn">返回主畫面</button>
    </div>

    <script type="module" src="main.js"></script>
</body>

</html>
